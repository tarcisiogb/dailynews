name: Briefing de Mercado

"on":
  schedule:
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:

jobs:
  gerar-briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Sincronizar
        run: git pull origin main

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias
        run: pip install anthropic

      - name: Gerar briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python gerar_briefing.py

      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "Daily News Bot"
          git config user.email "bot@dailynews"
          git add dados/
          git diff --cached --quiet || git commit -m "Briefing $(date +'%d/%m/%Y')"
          git push https://x-access-token:${GH_TOKEN}@github.com/tarcisiogb/dailynews.git main
